(()=>{
const $=s=>document.querySelector(s),all=s=>Array.from(document.querySelectorAll(s)),canvas=$('#map-canvas');
const mobile=matchMedia('(max-width:700px)');
let current='overview',selected='A01',zoom=1,base=[],vb=[],drag=null,moved=false,pinch=null,resizeFrame;
const pointers=new Map();
function scrollHint(el){
 el.classList.toggle('fade-top',el.scrollTop>2);
 el.classList.toggle('fade-bottom',el.scrollHeight-el.clientHeight-el.scrollTop>2);
}
const scrollLists=[$('#area-pins'),$('#area-contents')];
scrollLists.forEach(el=>{el.addEventListener('scroll',()=>scrollHint(el),{passive:true});new ResizeObserver(()=>scrollHint(el)).observe(el);});
function select(id){
 const o=MAP.items[id];if(!o)return;selected=id;
 $('#selected-name').textContent=o.id+' · '+o.name;$('#selected-icon').innerHTML=o.icon;
 all('#area-pins button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===id)));
 const list=$('#area-contents');list.replaceChildren();
 for(const text of o.contents){const li=document.createElement('li');li.textContent=text;list.append(li);}
 list.scrollTop=0;
 all('#map-canvas a[data-id]').forEach(a=>a.classList.toggle('selected',a.dataset.id===id));
 all('#map-canvas .selection-outline').forEach(e=>e.remove());
 all('#map-canvas a.selected').forEach(a=>{
  const shape=a.querySelector(':scope > rect, :scope > ellipse');if(!shape)return;
  const group=document.createElementNS('http://www.w3.org/2000/svg','g');group.setAttribute('class','selection-outline');group.setAttribute('pointer-events','none');
  for(const [color,width] of [['#fff',6],['#eb9f23',3]]){const ring=shape.cloneNode(false);ring.removeAttribute('class');ring.removeAttribute('id');ring.style.cssText='fill:none;fill-opacity:0;stroke:'+color+';stroke-width:'+width+'px;vector-effect:non-scaling-stroke;';group.append(ring);}
  a.append(group);
 });
 requestAnimationFrame(()=>scrollLists.forEach(scrollHint));
}
function selectPin(id){
 if(current==='overview' && !canvas.querySelector('a[data-id="'+id+'"]')){view('outdoor',id);return;}
 select(id);
}
function choices(){
 const ids=Object.keys(MAP.items).filter(id=>current==='indoor'?id.startsWith('D'):current==='outdoor'?['A05','A06','A07','B01','B02-1','B02-2','B03','B04','B05','C02','C03-1','C03-2'].includes(id):!id.startsWith('D')).sort();
 $('#area-pins').replaceChildren(...ids.map(id=>{const item=MAP.items[id],b=document.createElement('button');b.type='button';b.dataset.id=id;b.style.setProperty('--pin-color',item.color);b.setAttribute('aria-pressed','false');b.setAttribute('aria-controls','area-contents');b.innerHTML=item.icon;const label=document.createElement('span');label.textContent=item.name;const code=document.createElement('small');code.textContent=id;label.prepend(code);b.append(label);b.addEventListener('click',()=>selectPin(id));return b;}));
 $('#area-pins').scrollTop=0;
}
function paint(){canvas.setAttribute('viewBox',vb.join(' '));$('#zoom-label').textContent=Math.round(zoom*100)+'%';}
function fit(){const r=canvas.getBoundingClientRect();if(!r.width||!r.height)return;const def=MAP.views[current],b=(mobile.matches?def.mobileBox:def.box).slice(),aspect=r.width/r.height;let w=b[2],h=b[3];if(w/h>aspect)h=w/aspect;else w=h*aspect;base=[b[0]+b[2]/2-w/2,b[1]+b[3]/2-h/2,w,h];vb=base.slice();zoom=1;paint();}
function scale(f,point){const n=Math.max(.8,Math.min(6,zoom*f));if(n===zoom)return;const r=canvas.getBoundingClientRect(),rx=point?(point.x-r.left)/r.width:.5,ry=point?(point.y-r.top)/r.height:.5,w=base[2]/n,h=base[3]/n;vb=[vb[0]+vb[2]*rx-w*rx,vb[1]+vb[3]*ry-h*ry,w,h];zoom=n;paint();}
function render(){const v=MAP.views[current];canvas.innerHTML='<title>'+v.label+'</title>'+(mobile.matches?v.mobileSvg:v.svg);canvas.dataset.view=current;fit();select(selected);}
function view(name,id){if(!MAP.views[name])return;current=name;selected=id||(name==='indoor'?'D01':name==='outdoor'?'A06':'A01');$('#view-title').textContent=MAP.views[name].label;choices();$('#legend').hidden=name!=='indoor';$('#map-panel').setAttribute('aria-labelledby','tab-'+name);canvas.setAttribute('aria-label',MAP.views[name].label);all('nav button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===name)));render();try{history.replaceState(null,'','#'+name);}catch{}}
all('nav button').forEach((b,i)=>{b.addEventListener('click',()=>view(b.dataset.view));b.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const j=e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3,n=all('nav button')[j];n.focus();view(n.dataset.view);});});
canvas.addEventListener('click',e=>{const a=e.target.closest('[data-id]');if(!a)return;e.preventDefault();if(moved){moved=false;return;}select(a.dataset.id);const pin=$('#area-pins button[data-id="'+a.dataset.id+'"]');if(pin)pin.scrollIntoView({block:'nearest',inline:'nearest'});});
$('#zoom-in').addEventListener('click',()=>scale(1.35));$('#zoom-out').addEventListener('click',()=>scale(1/1.35));$('#fit').addEventListener('click',fit);
function expand(active){document.body.classList.toggle('expanded',active);$('#expand').setAttribute('aria-pressed',String(active));$('#expand').textContent=active?'收起':'展开';requestAnimationFrame(fit);}
$('#expand').addEventListener('click',()=>expand(!document.body.classList.contains('expanded')));document.addEventListener('keydown',e=>{if(e.key==='Escape')expand(false);});
canvas.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();scale(Math.exp(-e.deltaY*.004),{x:e.clientX,y:e.clientY});},{passive:false});
canvas.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;drag={x:e.clientX,y:e.clientY,box:vb.slice()};if(pointers.size===2){const p=[...pointers.values()];pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);}canvas.style.cursor='grabbing';});
window.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const p=[...pointers.values()],dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pinch)scale(dist/pinch,{x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2});pinch=dist;moved=true;return;}if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;const r=canvas.getBoundingClientRect();vb=[drag.box[0]-dx/r.width*drag.box[2],drag.box[1]-dy/r.height*drag.box[3],drag.box[2],drag.box[3]];paint();});
function end(e){pointers.delete(e.pointerId);drag=null;pinch=null;canvas.style.cursor='';}window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);
mobile.addEventListener('change',render);new ResizeObserver(()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(fit);}).observe(canvas);
view(MAP.views[location.hash.slice(1)]?location.hash.slice(1):'overview');
})();
</script>
